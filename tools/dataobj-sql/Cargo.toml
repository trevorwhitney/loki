[package]
name = "dataobj-sql"
version = "0.1.0"
edition = "2021"
description = "Run DataFusion SQL against Loki data objects served by tools/dataobj-flight"
publish = false

[dependencies]
# datafusion-postgres 0.18 pins datafusion 54, which pins arrow 58;
# arrow-flight must match that major version so the RecordBatch types are
# interchangeable.
datafusion = "54.1"
arrow-flight = "58"
datafusion-postgres = "0.18"
log = "0.4"
env_logger = "0.11"
tonic = "0.14"
prost = "0.14"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "io-std", "io-util"] }
futures = "0.3"
async-trait = "0.1"
clap = { version = "4", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
prometheus = { version = "0.13", default-features = false }

[build-dependencies]
prost-build = "0.14"
